name: runc integration tests

# Runs runc's bats integration test suite against the takoyaki binary.
# Scheduled daily and on manual dispatch so it does not block PRs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  runc-bats:
    name: runc bats (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev jq golang-go strace

      - name: Install jextract
        run: |
          curl -s "https://get.sdkman.io" | bash
          echo "sdkman_auto_answer=true" >> "$HOME/.sdkman/etc/config"
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install jextract
          echo "$HOME/.sdkman/candidates/jextract/current/bin" >> "$GITHUB_PATH"

      - name: Install GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'gradle'

      - name: Setup bats
        uses: bats-core/bats-action@3.0.1
        with:
          bats-version: 1.9.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Build native takoyaki
        run: ./gradlew nativeCompile --no-daemon --no-configuration-cache

      # ── diagnose arm slowness: run each idmap test individually with timing ──
      - name: Per-test idmap timing (takoyaki vs runc)
        if: contains(matrix.runner, 'arm')
        timeout-minutes: 60
        run: |
          set -eux
          RUNC_DIR="tests/runc/src/github.com/opencontainers/runc"
          cd "$RUNC_DIR"

          sudo make test-binaries
          sudo chmod +x tests/integration/get-images.sh
          sudo tests/integration/get-images.sh > /dev/null

          cp "$GITHUB_WORKSPACE/build/native/nativeCompile/takoyaki" ./takoyaki
          chmod +x ./takoyaki
          go build -o ./runc-real .

          BATS=$(command -v bats)

          # Extract all idmap test names
          grep '@test "' tests/integration/idmap.bats \
            | sed 's/.*@test "\(.*\)" {.*/\1/' > /tmp/idmap-tests.txt
          echo "Found $(wc -l < /tmp/idmap-tests.txt) idmap tests"
          cat /tmp/idmap-tests.txt

          echo ""
          echo "=========================================="
          echo "=== Per-test timing with TAKOYAKI ==="
          echo "=========================================="
          cp ./takoyaki ./runc
          chmod +x ./runc
          i=0
          while IFS= read -r tname; do
            i=$((i+1))
            escaped=$(printf '%s' "$tname" | sed 's/[][\\.*^$()|+?{}]/\\&/g')
            echo "--- [$i] $tname ---"
            START_SEC=$SECONDS
            sudo -E PATH="$PATH" script -q -e -c \
              "$BATS -f '^${escaped}\$' -t tests/integration/idmap.bats" \
              /dev/null 2>&1 || true
            ELAPSED=$((SECONDS - START_SEC))
            echo "  -> ${ELAPSED}s"
            echo ""
          done < /tmp/idmap-tests.txt

          echo ""
          echo "=========================================="
          echo "=== Per-test timing with RUNC (Go) ==="
          echo "=========================================="
          cp ./runc-real ./runc
          chmod +x ./runc
          i=0
          while IFS= read -r tname; do
            i=$((i+1))
            escaped=$(printf '%s' "$tname" | sed 's/[][\\.*^$()|+?{}]/\\&/g')
            echo "--- [$i] $tname ---"
            START_SEC=$SECONDS
            sudo -E PATH="$PATH" script -q -e -c \
              "$BATS -f '^${escaped}\$' -t tests/integration/idmap.bats" \
              /dev/null 2>&1 || true
            ELAPSED=$((SECONDS - START_SEC))
            echo "  -> ${ELAPSED}s"
            echo ""
          done < /tmp/idmap-tests.txt

          echo ""
          echo "=========================================="
          echo "=== ALL 25 idmap tests at once: TAKOYAKI ==="
          echo "=========================================="
          cp ./takoyaki ./runc
          chmod +x ./runc
          time sudo -E PATH="$PATH" script -q -e -c \
            "$BATS -t tests/integration/idmap.bats" \
            /dev/null 2>&1 || true

          echo ""
          echo "=========================================="
          echo "=== ALL 25 idmap tests at once: RUNC ==="
          echo "=========================================="
          cp ./runc-real ./runc
          chmod +x ./runc
          time sudo -E PATH="$PATH" script -q -e -c \
            "$BATS -t tests/integration/idmap.bats" \
            /dev/null 2>&1 || true

      # Commented out to get diagnostic results faster
      # - name: Run runc integration tests
      #   run: |
      #     ./tests/runc/runc_integration_test.sh \
      #       build/native/nativeCompile/takoyaki
