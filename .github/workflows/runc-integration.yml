name: runc integration tests

# Runs runc's bats integration test suite against the takoyaki binary.
# Scheduled daily and on manual dispatch so it does not block PRs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  runc-bats:
    name: runc bats (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev jq golang-go strace

      - name: Install jextract
        run: |
          curl -s "https://get.sdkman.io" | bash
          echo "sdkman_auto_answer=true" >> "$HOME/.sdkman/etc/config"
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install jextract
          echo "$HOME/.sdkman/candidates/jextract/current/bin" >> "$GITHUB_PATH"

      - name: Install GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'gradle'

      - name: Setup bats
        uses: bats-core/bats-action@3.0.1
        with:
          bats-version: 1.9.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Build native takoyaki
        run: ./gradlew nativeCompile --no-daemon --no-configuration-cache

      # ── diagnose arm slowness: per-test timing with 120s timeout each ──
      - name: Per-test idmap timing (takoyaki vs runc)
        if: contains(matrix.runner, 'arm')
        timeout-minutes: 60
        run: |
          set -eux
          RUNC_DIR="tests/runc/src/github.com/opencontainers/runc"
          cd "$RUNC_DIR"

          sudo make test-binaries
          sudo chmod +x tests/integration/get-images.sh
          sudo tests/integration/get-images.sh > /dev/null

          cp "$GITHUB_WORKSPACE/build/native/nativeCompile/takoyaki" ./takoyaki
          chmod +x ./takoyaki
          go build -o ./runc-real .

          BATS=$(command -v bats)

          # Extract all idmap test names into an array (avoids stdin
          # consumption by script/sudo in the loop body).
          mapfile -t TESTS < <(grep '@test "' tests/integration/idmap.bats \
            | sed 's/.*@test "\(.*\)" {.*/\1/')
          echo "Found ${#TESTS[@]} idmap tests"
          printf '  %s\n' "${TESTS[@]}"

          run_tests() {
            local label="$1" runtime="$2"
            cp "$runtime" ./runc
            chmod +x ./runc
            echo ""
            echo "=========================================="
            echo "=== Per-test timing with $label ==="
            echo "=========================================="
            local i=0
            for tname in "${TESTS[@]}"; do
              i=$((i+1))
              local escaped
              escaped=$(printf '%s' "$tname" | sed 's/[][\\.*^$()|+?{}]/\\&/g')
              echo "--- [$i/${#TESTS[@]}] $tname ---"
              local start=$SECONDS
              timeout 120 sudo -E PATH="$PATH" \
                script -q -e -c \
                "$BATS -f '^${escaped}\$' -t tests/integration/idmap.bats" \
                /dev/null </dev/null 2>&1 || echo "  (exit $?)"
              echo "  -> $((SECONDS - start))s"
            done
          }

          run_tests "TAKOYAKI" ./takoyaki
          run_tests "RUNC" ./runc-real

      # Commented out to get diagnostic results faster
      # - name: Run runc integration tests
      #   run: |
      #     ./tests/runc/runc_integration_test.sh \
      #       build/native/nativeCompile/takoyaki
