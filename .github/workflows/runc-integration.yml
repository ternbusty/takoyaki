name: runc integration tests

# Runs runc's bats integration test suite against the takoyaki binary.
# Scheduled daily and on manual dispatch so it does not block PRs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  runc-bats:
    name: runc bats (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev jq golang-go strace

      - name: Install jextract
        run: |
          curl -s "https://get.sdkman.io" | bash
          echo "sdkman_auto_answer=true" >> "$HOME/.sdkman/etc/config"
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install jextract
          echo "$HOME/.sdkman/candidates/jextract/current/bin" >> "$GITHUB_PATH"

      - name: Install GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'gradle'

      - name: Setup bats
        uses: bats-core/bats-action@3.0.1
        with:
          bats-version: 1.9.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Build native takoyaki
        run: ./gradlew nativeCompile --no-daemon --no-configuration-cache

      # ── diagnose 3 hanging idmap tests with debug logs + process monitor ──
      - name: Debug hanging idmap tests (takoyaki vs runc)
        if: contains(matrix.runner, 'arm')
        timeout-minutes: 30
        run: |
          set -eux
          RUNC_DIR="tests/runc/src/github.com/opencontainers/runc"
          cd "$RUNC_DIR"

          sudo make test-binaries
          sudo chmod +x tests/integration/get-images.sh
          sudo tests/integration/get-images.sh > /dev/null

          cp "$GITHUB_WORKSPACE/build/native/nativeCompile/takoyaki" ./takoyaki-real
          chmod +x ./takoyaki-real
          go build -o ./runc-real .

          # Create a wrapper that enables --debug --log for takoyaki.
          # Each invocation appends to the same log file.
          cat > ./takoyaki-debug << 'WRAPPER'
          #!/bin/bash
          exec "$(dirname "$0")/takoyaki-real" --debug --log /tmp/takoyaki-debug.log "$@"
          WRAPPER
          chmod +x ./takoyaki-debug

          BATS=$(command -v bats)

          # Only the 3 tests that hang on CI arm.
          HANGING=(
            "same idmap mount (different mappings) [userns]"
            "idmap mount (idmap flag) [userns]"
            "idmap mount (idmap flag, implied mapping) [userns]"
          )

          # Watchdog: after 30s dump process info to diagnose hangs.
          watchdog() {
            sleep 30
            echo ""
            echo "====== WATCHDOG: test hung for 30s ======"
            echo "--- process tree ---"
            ps auxf 2>/dev/null || ps aux
            echo "--- runc/takoyaki processes ---"
            for pid in $(pgrep -f 'takoyaki-real|runc' 2>/dev/null); do
              echo "PID=$pid cmdline=$(tr '\0' ' ' < /proc/$pid/cmdline 2>/dev/null)"
              echo "  wchan=$(cat /proc/$pid/wchan 2>/dev/null)"
              echo "  status: $(grep -E 'State:|Threads:|voluntary' /proc/$pid/status 2>/dev/null | tr '\n' ' ')"
              echo "  stack (first 10 lines):"
              head -10 /proc/$pid/stack 2>/dev/null || echo "  (no access)"
            done
            echo "--- mount count ---"
            wc -l /proc/self/mountinfo
            echo "====== END WATCHDOG ======"
          }

          echo "=========================================="
          echo "=== TAKOYAKI (with debug) ==="
          echo "=========================================="
          cp ./takoyaki-debug ./runc
          chmod +x ./runc
          for tname in "${HANGING[@]}"; do
            escaped=$(printf '%s' "$tname" | sed 's/[][\\.*^$()|+?{}]/\\&/g')
            echo ""
            echo "--- $tname ---"
            rm -f /tmp/takoyaki-debug.log
            watchdog &
            WD=$!
            start=$SECONDS
            timeout 60 sudo -E PATH="$PATH" \
              script -q -e -c \
              "$BATS -f '^${escaped}\$' -t tests/integration/idmap.bats" \
              /dev/null </dev/null 2>&1 || echo "  (exit $?)"
            elapsed=$((SECONDS - start))
            echo "  -> ${elapsed}s"
            kill $WD 2>/dev/null; wait $WD 2>/dev/null || true

            echo "--- takoyaki debug log (last 80 lines) ---"
            tail -80 /tmp/takoyaki-debug.log 2>/dev/null || echo "(no log)"
            echo "--- end debug log ---"
          done

          echo ""
          echo "=========================================="
          echo "=== RUNC (native Go, same 3 tests) ==="
          echo "=========================================="
          cp ./runc-real ./runc
          chmod +x ./runc
          for tname in "${HANGING[@]}"; do
            escaped=$(printf '%s' "$tname" | sed 's/[][\\.*^$()|+?{}]/\\&/g')
            echo ""
            echo "--- $tname ---"
            start=$SECONDS
            timeout 60 sudo -E PATH="$PATH" \
              script -q -e -c \
              "$BATS -f '^${escaped}\$' -t tests/integration/idmap.bats" \
              /dev/null </dev/null 2>&1 || echo "  (exit $?)"
            echo "  -> $((SECONDS - start))s"
          done

      # Commented out to get diagnostic results faster
      # - name: Run runc integration tests
      #   run: |
      #     ./tests/runc/runc_integration_test.sh \
      #       build/native/nativeCompile/takoyaki
