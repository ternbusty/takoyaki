name: runc integration tests

# Runs runc's bats integration test suite against the takoyaki binary.
# Scheduled daily and on manual dispatch so it does not block PRs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  runc-bats:
    name: runc bats (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev jq golang-go strace

      - name: Install jextract
        run: |
          curl -s "https://get.sdkman.io" | bash
          echo "sdkman_auto_answer=true" >> "$HOME/.sdkman/etc/config"
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install jextract
          echo "$HOME/.sdkman/candidates/jextract/current/bin" >> "$GITHUB_PATH"

      - name: Install GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'gradle'

      - name: Setup bats
        uses: bats-core/bats-action@3.0.1
        with:
          bats-version: 1.9.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Build native takoyaki
        run: ./gradlew nativeCompile --no-daemon --no-configuration-cache

      # ── diagnose arm slowness ──
      - name: Time idmap test (takoyaki vs runc)
        if: contains(matrix.runner, 'arm')
        timeout-minutes: 30
        run: |
          set -eux
          RUNC_DIR="tests/runc/src/github.com/opencontainers/runc"
          cd "$RUNC_DIR"

          # Build test helper binaries and fetch images
          sudo make test-binaries
          sudo chmod +x tests/integration/get-images.sh
          sudo tests/integration/get-images.sh > /dev/null

          cp "$GITHUB_WORKSPACE/build/native/nativeCompile/takoyaki" ./takoyaki
          chmod +x ./takoyaki

          # Build real runc for comparison
          go build -o ./runc-real .

          # Resolve bats path (installed by bats-action to ~/.local/share/bats/bin)
          BATS=$(command -v bats)
          echo "bats at: $BATS"

          echo "=== 1. Baseline: single idmap test with RUNC (Go binary) ==="
          cp ./runc-real ./runc
          chmod +x ./runc
          time sudo -E PATH="$PATH" script -q -e -c \
            "$BATS -f '^simple idmap mount .userns.\$' -t tests/integration/idmap.bats" \
            /dev/null 2>&1 || true

          echo ""
          echo "=== 2. Same test with TAKOYAKI ==="
          cp ./takoyaki ./runc
          chmod +x ./runc
          time sudo -E PATH="$PATH" script -q -e -c \
            "$BATS -f '^simple idmap mount .userns.\$' -t tests/integration/idmap.bats" \
            /dev/null 2>&1 || true

          echo ""
          echo "=== 3. time takoyaki create vs runc create (simple container) ==="
          mkdir -p /tmp/strace-bundle/rootfs
          BUSYBOX=$(eval $(sudo tests/integration/get-images.sh) && echo $BUSYBOX_IMAGE)
          tar --exclude './dev/*' -C /tmp/strace-bundle/rootfs -xf "$BUSYBOX" 2>/dev/null || true
          cd /tmp/strace-bundle
          "$GITHUB_WORKSPACE/$RUNC_DIR/takoyaki" spec
          jq '.process.args = ["true"]' config.json > config2.json && mv config2.json config.json

          echo "--- time takoyaki create ---"
          time sudo "$GITHUB_WORKSPACE/$RUNC_DIR/takoyaki" \
            create --bundle /tmp/strace-bundle time-test1 2>&1 || true
          sudo "$GITHUB_WORKSPACE/$RUNC_DIR/takoyaki" \
            delete -f time-test1 2>/dev/null || true

          echo "--- time runc create ---"
          time sudo "$GITHUB_WORKSPACE/$RUNC_DIR/runc-real" \
            create --bundle /tmp/strace-bundle time-test2 2>&1 || true
          sudo "$GITHUB_WORKSPACE/$RUNC_DIR/runc-real" \
            delete -f time-test2 2>/dev/null || true

          echo ""
          echo "=== 4. strace -c (no -f) on takoyaki create (60s timeout) ==="
          timeout 60 sudo strace -c "$GITHUB_WORKSPACE/$RUNC_DIR/takoyaki" \
            create --bundle /tmp/strace-bundle strace-test1 2>&1 || true
          sudo "$GITHUB_WORKSPACE/$RUNC_DIR/takoyaki" \
            delete -f strace-test1 2>/dev/null || true

          echo ""
          echo "=== 5. perf stat on takoyaki create ==="
          sudo perf stat -e task-clock,context-switches,cpu-migrations,page-faults,cycles,instructions \
            "$GITHUB_WORKSPACE/$RUNC_DIR/takoyaki" \
            create --bundle /tmp/strace-bundle perf-test1 2>&1 || true
          sudo "$GITHUB_WORKSPACE/$RUNC_DIR/takoyaki" \
            delete -f perf-test1 2>/dev/null || true

          echo "--- perf stat on runc create ---"
          sudo perf stat -e task-clock,context-switches,cpu-migrations,page-faults,cycles,instructions \
            "$GITHUB_WORKSPACE/$RUNC_DIR/runc-real" \
            create --bundle /tmp/strace-bundle perf-test2 2>&1 || true
          sudo "$GITHUB_WORKSPACE/$RUNC_DIR/runc-real" \
            delete -f perf-test2 2>/dev/null || true

          echo ""
          echo "=== 6. Full mounts.bats timing (3 tests) with takoyaki ==="
          cd "$GITHUB_WORKSPACE/$RUNC_DIR"
          cp ./takoyaki ./runc
          time sudo -E PATH="$PATH" script -q -e -c \
            "$BATS -f '^runc run with tmpfs' -t tests/integration/mounts.bats" \
            /dev/null 2>&1 || true

      - name: Run runc integration tests
        run: |
          ./tests/runc/runc_integration_test.sh \
            build/native/nativeCompile/takoyaki
